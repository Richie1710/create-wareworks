modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ponder"
type = "required"
versionRange = "[${ponder_version},)"
ordering = "AFTER"
side = "BOTH"

# Optional and client only: with JEI installed, its "+" lays a crafting recipe into the warehouse terminal's grid.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"
