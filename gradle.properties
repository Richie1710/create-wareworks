org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Platform (fixed - see docs/dependencies.md before changing anything here)
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.256
# The NeoForge the mod declares it needs, decoupled from the build version above: the build follows the newest
# 21.1.x, while the minimum stays at the oldest release the code is known to run on, so a server or pack that
# has not moved yet is not refused.
neo_version_range=[21.1.250,)
loader_version_range=[1,)

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---------------------------------------------------------------------------
# Create and its (non-transitive) companion libraries.
# Versions mirror the gradle.properties of the Create release tag mc1.21.1-6.0.10.
# ---------------------------------------------------------------------------
# https://maven.createmod.net/com/simibubi/create/create-1.21.1/
# 6.0.10-280 is the Maven build whose Git-Hash matches the release tag mc1.21.1-6.0.10.
create_version=6.0.10-280
create_version_range=[6.0.10,6.1)
# https://maven.createmod.net/net/createmod/ponder/ponder-neoforge/
ponder_version=1.0.82
# https://maven.createmod.net/dev/engine-room/flywheel/
flywheel_version=1.0.6
# https://maven.createmod.net/dev/engine-room/vanillin/
vanillin_version=1.1.3-41
# https://maven.ithundxr.dev/snapshots/com/tterrag/registrate/Registrate/
registrate_version=MC1.21-1.3.0+67

# ---------------------------------------------------------------------------
# JEI: an optional, client-only integration (its "+" lays a crafting recipe into the terminal's grid).
# Compile-only against the API and never bundled. The dev runs only get the full JEI with -Pwareworks.jei
# (this version) or -Pwareworks.jei=<version> (any other published one); without it they run without JEI.
# ---------------------------------------------------------------------------
# https://maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge-api/
# 19.21.0.247 is the JEI that Create 6.0.10's POM pins.
jei_version=19.21.0.247
# The JEI the mod accepts next to it (optional, client only): every JEI published for 1.21.1, the oldest of which is
# 19.8.4.110. The "+" was run on 19.8.4.110, 19.19.6.236, 19.21.0.247, 19.57.0.451 and 19.64.0.454. FML treats an
# out-of-range optional dependency as a loading error, so this floor only turns away a JEI that is not for 1.21.1.
jei_version_range=[19.8.4.110,)

# ---------------------------------------------------------------------------
# Mod
# ---------------------------------------------------------------------------
mod_id=wareworks
mod_name=Create: Wareworks
mod_license=GPL-3.0-only
mod_version=0.13.0-beta
mod_group_id=dev.wareworks
mod_authors=Richie1710
mod_description=Mechanical Storage & Intralogistics for Create: physical high-bay warehouses served by kinetic stacker cranes. Items are never teleported - every store and retrieve is carried out visibly by a machine.

# Publishing
curseforge_project_id=1699395
